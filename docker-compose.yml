# OPTIONAL development helper - a throw-away SQL Server for machines that do not have SQL Server LocalDB/Express.
# The API itself does not need Docker. On a Windows laptop with Visual Studio, LocalDB (the default connection
# string in appsettings.json) is simpler and you can ignore this file.
#
#   1. copy .env.example to .env and choose your own strong password
#   2. docker compose up -d
#   3. point the API at it (see README, "Using a Docker SQL Server")
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"   # reachable from this machine only, not from the network
    volumes:
      - tms-sqlserver-data:/var/opt/mssql

volumes:
  tms-sqlserver-data:
